name: Package or release static site

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег вида vX.Y или vX.Y.Z; нужен только при публикации Release'
        required: false
        type: string
      publish_release:
        description: 'Устаревший путь отключен. Release создается из проверенного комплекта вручную'
        required: true
        default: false
        type: boolean
      deploy_pages:
        description: 'Развернуть текущий commit в GitHub Pages'
        required: true
        default: false
        type: boolean
      owner_waived_v1732:
        description: 'Разовая доставка готовой v17.32 по решению владельца, без новых тестов'
        required: false
        default: false
        type: boolean

concurrency:
  group: static-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.owner_waived_v1732 == true) }}
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify public build
        run: node .quality/verify-public.mjs
      - name: Build reproducible public ZIP from an explicit allowlist
        run: >-
          git archive --format=zip --output=roadmap-site-public.zip HEAD
          README.md RELEASE_NOTES.md LICENSE app.html avatar.jpg catalog-img catalog.html index.html release.json
          media robots.txt schemas Инструкция_Roadmap.md Локер-роадмапов.html
          updates
      - name: Verify the release ZIP excludes private material
        run: |
          if unzip -Z1 roadmap-site-public.zip | grep -Eq '(^|/)private/|(^|/)roadmap-data\.json$|(^|/)roadmap\.html$'; then
            echo "Release ZIP contains private material." >&2
            exit 1
          fi
      - name: Upload dry-run artifact
        uses: actions/upload-artifact@v7
        with:
          name: roadmap-static-${{ github.sha }}
          path: roadmap-site-public.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Reject legacy publication
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Stop without changing tags or release assets
        run: |
          echo "::error::Старый путь публикации отключен: он не проверял совпадение тега и архива. Создайте новый тег на проверенном commit и отдельный Release с публичным ZIP, его SHA-256 и разрешенным подписанным обновлением. См. README.md."
          exit 1
  pages:
    name: Deploy GitHub Pages
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify again before Pages
        run: node .quality/verify-public.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build tracked-only Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if git ls-tree -r HEAD | awk '$1 == "120000" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Pages artifact не допускает символические ссылки." >&2
            exit 1
          fi
          mkdir _site
          git archive --format=tar HEAD | tar -xf - -C _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  owner-v1732-delivery:
    name: Owner-authorized v17.32 delivery (no QA)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.owner_waived_v1732 == true && inputs.deploy_pages == true && inputs.publish_release != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact approved release (not workflow revision)
        uses: actions/checkout@v6
        with:
          ref: ec8a0d535c09d6c4e1a2fec1d6162a94cecc39b1
      - name: Verify immutable delivery inventory, not product QA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ec8a0d535c09d6c4e1a2fec1d6162a94cecc39b1
          test "$(git rev-parse 'HEAD^{tree}')" = a3b5e08cdb53b9f43861fdabc0eefd3946c58782
          test "$(git ls-tree -r --name-only HEAD | wc -l | tr -d ' ')" = 130
          test "$(git ls-remote origin 'refs/tags/v17.32^{}' | cut -f1)" = ec8a0d535c09d6c4e1a2fec1d6162a94cecc39b1
          if git ls-tree -r HEAD | awk '$1 != "100644" && $1 != "100755" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Unexpected symlink or non-file in approved inventory" >&2
            exit 1
          fi
          sha256sum -c <<'SUMS'
          eb3c4838da1ae30dadba80b5451aa28836025ef5efa6fe5d609792f4db5a9b70  app.html
          9e283a776c195f7382da53c8d12fbd84e5b40822675c27a120d267ebd7bda842  updates/roadmap-v17.32.roadmap-update
          6647c238346d57463efc655c0d52cbcbd849d131e7403866e26e0a6c08d96ebc  media/media-manifest.json
          0dc8f75e7291abb7f60e34c16f7d4c9a5b75721f37932509a58339b0439870cb  catalog-img/media-manifest.json
          SUMS
          echo 'Owner-authorized delivery only. No new tests. Full release QA remains NOT PASSED.' >> "$GITHUB_STEP_SUMMARY"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Package only the approved Git tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          git archive --format=tar ec8a0d535c09d6c4e1a2fec1d6162a94cecc39b1 | tar -xf - -C _site
      - name: Upload approved Pages files
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
      - name: Deploy approved v17.32
        id: deployment
        uses: actions/deploy-pages@v5
