name: Package or release static site

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег вида vX.Y или vX.Y.Z; нужен только при публикации Release'
        required: false
        type: string
      publish_release:
        description: 'Устаревший путь отключен. Release создается из проверенного комплекта вручную'
        required: true
        default: false
        type: boolean
      deploy_pages:
        description: 'Развернуть текущий commit в GitHub Pages'
        required: true
        default: false
        type: boolean

concurrency:
  group: static-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify public build
        run: node .quality/verify-public.mjs
      - name: Build reproducible public ZIP from an explicit allowlist
        run: >-
          git archive --format=zip --output=roadmap-site-public.zip HEAD
          README.md RELEASE_NOTES.md LICENSE app.html avatar.jpg catalog-img catalog.html index.html
          media robots.txt schemas Инструкция_Roadmap.md Локер-роадмапов.html
      - name: Verify the release ZIP excludes private material
        run: |
          if unzip -Z1 roadmap-site-public.zip | grep -Eq '(^|/)private/|(^|/)roadmap-data\.json$|(^|/)roadmap\.html$'; then
            echo "Release ZIP contains private material." >&2
            exit 1
          fi
      - name: Upload dry-run artifact
        uses: actions/upload-artifact@v7
        with:
          name: roadmap-static-${{ github.sha }}
          path: roadmap-site-public.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Reject legacy publication
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Stop without changing tags or release assets
        run: |
          echo "::error::Старый путь публикации отключен: он не проверял совпадение тега и архива. Создайте новый тег на проверенном commit и отдельный Release только с Roadmap-vX.Y.Z-public.zip и его SHA-256. См. README.md."
          exit 1
  pages:
    name: Deploy GitHub Pages
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify again before Pages
        run: node .quality/verify-public.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build tracked-only Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if git ls-tree -r HEAD | awk '$1 == "120000" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Pages artifact не допускает символические ссылки." >&2
            exit 1
          fi
          mkdir _site
          git archive --format=tar HEAD | tar -xf - -C _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
