name: Package or release static site

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег вида vX.Y или vX.Y.Z; нужен только при публикации Release'
        required: false
        type: string
      publish_release:
        description: 'Устаревший путь отключен. Release создается из проверенного комплекта вручную'
        required: true
        default: false
        type: boolean
      deploy_pages:
        description: 'Развернуть текущий commit в GitHub Pages'
        required: true
        default: false
        type: boolean

      owner_pages_v1733:
        description: 'Только доставка подготовленной v17.33 по разрешению владельца; без нового QA'
        required: false
        type: boolean
        default: false

concurrency:
  group: static-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.repository == 'uchvru/roadmap' && github.actor == 'uchvru' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.owner_pages_v1733 == true && inputs.deploy_pages == true && inputs.publish_release == false && inputs.release_tag == 'v17.33') }}
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify public build
        run: node .quality/verify-public.mjs
      - name: Build reproducible public ZIP from an explicit allowlist
        run: >-
          git archive --format=zip --output=roadmap-site-public.zip HEAD
          README.md RELEASE_NOTES.md LICENSE app.html avatar.jpg catalog-img catalog.html index.html release.json
          media robots.txt schemas Инструкция_Roadmap.md Локер-роадмапов.html
          updates
      - name: Verify the release ZIP excludes private material
        run: |
          if unzip -Z1 roadmap-site-public.zip | grep -Eq '(^|/)private/|(^|/)roadmap-data\.json$|(^|/)roadmap\.html$'; then
            echo "Release ZIP contains private material." >&2
            exit 1
          fi
      - name: Upload dry-run artifact
        uses: actions/upload-artifact@v7
        with:
          name: roadmap-static-${{ github.sha }}
          path: roadmap-site-public.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Reject legacy publication
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Stop without changing tags or release assets
        run: |
          echo "::error::Старый путь публикации отключен: он не проверял совпадение тега и архива. Создайте новый тег на проверенном commit и отдельный Release с публичным ZIP, его SHA-256 и разрешенным подписанным обновлением. См. README.md."
          exit 1
  pages:
    name: Deploy GitHub Pages
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify again before Pages
        run: node .quality/verify-public.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build tracked-only Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if git ls-tree -r HEAD | awk '$1 == "120000" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Pages artifact не допускает символические ссылки." >&2
            exit 1
          fi
          mkdir _site
          git archive --format=tar HEAD | tar -xf - -C _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  scoped-v1733-pages:
    name: Deliver pinned v17.33 (owner exception, no QA)
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'uchvru/roadmap' && github.actor == 'uchvru' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.owner_pages_v1733 == true && inputs.deploy_pages == true && inputs.publish_release == false && inputs.release_tag == 'v17.33' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact approved release, never workflow HEAD
        uses: actions/checkout@v6
        with:
          ref: 2ca3ef1f1069947f5f8882e37caf04003f540bc7
      - name: Verify tag and bind to the sole owner dispatch on the live workflow revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2ca3ef1f1069947f5f8882e37caf04003f540bc7
          test "$(git rev-parse 'HEAD^{tree}')" = 09bc1be5d36e0ae99a0d274945c2cb69ebff15fb
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/tags/v17.33 | cut -f1)" = aa88ed6e9adf8a0bd36ad22a4ae1c35e60613221
          test "$(git ls-remote origin 'refs/tags/v17.33^{}' | cut -f1)" = 2ca3ef1f1069947f5f8882e37caf04003f540bc7
          test "$(gh api repos/uchvru/roadmap/releases/latest --jq '.tag_name')" = v17.33
          for attempt in 1 2 3 4 5; do
            runs="$(gh api "repos/uchvru/roadmap/actions/workflows/release.yml/runs?event=workflow_dispatch&head_sha=$GITHUB_SHA&per_page=2")"
            test "$(jq -r '.total_count' <<<"$runs")" = 0 || break
            sleep 2
          done
          jq -e --arg run "$GITHUB_RUN_ID" '.total_count == 1 and (.workflow_runs[0].id|tostring) == $run' <<<"$runs" >/dev/null
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          test "$(git rev-parse "$GITHUB_SHA^")" = 2ca3ef1f1069947f5f8882e37caf04003f540bc7
          test "$(git diff --name-only 2ca3ef1f1069947f5f8882e37caf04003f540bc7 "$GITHUB_SHA")" = .github/workflows/release.yml
      - name: Stage only pre-authorized bytes, never local or personal inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          payload = base64.b64decode('', validate=True)
          if hashlib.sha256(payload).hexdigest() != '323039cc616789efc1045c267018fc1b28cd1ce13d5bc5f5e3127cdd5cd8b177': raise SystemExit('Invalid pinned inventory')
          records = json.loads(payload)
          expected = {r['path']: r for r in records}
          tree = subprocess.check_output(['git','ls-tree','--full-tree','-r','-z','HEAD']).split(b'\0')[:-1]
          if len(tree) != len(records) or len(expected) != len(records): raise SystemExit('Wrong file count')
          staging = pathlib.Path('_site')
          staging.mkdir()
          for row in tree:
              header, rawname = row.split(b'\t', 1)
              mode, kind, oid = header.decode().split()
              name = rawname.decode('utf-8')
              if kind != 'blob' or mode not in ('100644','100755') or name not in expected: raise SystemExit('Unexpected tree entry: '+name)
              path = pathlib.PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts: raise SystemExit('Invalid public path')
              data = subprocess.check_output(['git','cat-file','blob',oid])
              item = expected.pop(name)
              if len(data) != item['bytes'] or hashlib.sha256(data).hexdigest() != item['sha256']: raise SystemExit('Wrong release bytes: '+name)
              # Match the normal Pages visible tree; git/CI dotfiles stay out.
              if any(p.startswith('.') for p in path.parts): continue
              out = staging / path
              out.parent.mkdir(parents=True, exist_ok=True)
              with open(out,'xb') as file: file.write(data)
          if expected: raise SystemExit('Missing release bytes')
          PY
          echo 'Delivery integrity only. Full release QA not passed. Prepublication inventory SHA-256: 8e2f3710b9957797505b687d20664bf9df51556d7f16f5649af943f0badc76be.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
      - name: Deploy verified v17.33 release bytes
        id: deployment
        uses: actions/deploy-pages@v5
