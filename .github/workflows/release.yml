name: Package or release static site

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Устаревший параметр; новые теги имеют вид vX.Y (Y — одна цифра)'
        required: false
        type: string
      publish_release:
        description: 'Устаревший путь отключен. Release создается из проверенного комплекта вручную'
        required: true
        default: false
        type: boolean
      deploy_pages:
        description: 'Развернуть текущий commit ветки main в GitHub Pages'
        required: true
        default: false
        type: boolean

concurrency:
  group: static-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      pages_artifact_name: ${{ steps.pages_payload.outputs.name }}
      pages_artifact_id: ${{ steps.upload_pages.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify public build
        run: node .quality/verify-public.mjs
      - name: Build reproducible public ZIP from an explicit allowlist
        run: >-
          git archive --format=zip --output=roadmap-site-public.zip HEAD
          README.md RELEASE_NOTES.md LICENSE app.html avatar.jpg catalog-img catalog.html index.html release.json
          media robots.txt schemas Инструкция_Roadmap.md Локер-роадмапов.html
          updates
      - name: Verify the release ZIP excludes private material
        run: |
          if unzip -Z1 roadmap-site-public.zip | grep -Eq '(^|/)private/|(^|/)roadmap-data\.json$|(^|/)roadmap\.html$'; then
            echo "Release ZIP contains private material." >&2
            exit 1
          fi
      - name: Upload dry-run artifact
        uses: actions/upload-artifact@v7
        with:
          name: roadmap-static-${{ github.sha }}
          path: roadmap-site-public.zip
          if-no-files-found: error
          retention-days: 14
      - name: Build tracked-only Pages artifact
        id: pages_payload
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true && inputs.publish_release != true && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          if git ls-tree -r HEAD | awk '$1 == "120000" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Pages artifact не допускает символические ссылки." >&2
            exit 1
          fi
          mkdir _site
          git archive --format=tar HEAD | tar -xf - -C _site
          echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        id: upload_pages
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true && inputs.publish_release != true && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: ${{ steps.pages_payload.outputs.name }}
          path: _site
          retention-days: 1

  release:
    name: Reject legacy publication
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Stop without changing tags or release assets
        run: |
          echo "::error::Старый путь публикации отключен: он не проверял совпадение тега и архива. Создайте новый тег на проверенном commit и отдельный Release с публичным ZIP, его SHA-256 и разрешенным подписанным обновлением. См. README.md."
          exit 1
  pages:
    name: Deploy GitHub Pages
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true && inputs.publish_release != true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the verified Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: ${{ needs.package.outputs.pages_artifact_name }}
          PAGES_ARTIFACT_ID: ${{ needs.package.outputs.pages_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ && "$PAGES_ARTIFACT_NAME" =~ ^github-pages-${GITHUB_RUN_ID}-[0-9]+$ ]]
          for ((attempt=1; attempt<=8; attempt++)); do
            if payload=$(timeout 5s gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$PAGES_ARTIFACT_NAME" 2>/dev/null) &&
              jq -e --arg id "$PAGES_ARTIFACT_ID" --arg name "$PAGES_ARTIFACT_NAME" --arg sha "$GITHUB_SHA" '
                .total_count == 1 and (.artifacts[0] | (.id | tostring) == $id and .name == $name and .expired == false and .workflow_run.head_sha == $sha)
              ' <<< "$payload" >/dev/null; then
              exit 0
            fi
            [[ "$attempt" == 8 ]] || sleep 2
          done
          echo "::error::The verified Pages artifact is not available for this commit. Retry failed jobs only while the artifact is retained." >&2
          exit 1
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.package.outputs.pages_artifact_name }}
