name: Package or release static site

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег вида vX.Y или vX.Y.Z; нужен только при публикации Release'
        required: false
        type: string
      publish_release:
        description: 'Создать GitHub Release (по умолчанию только dry-run артефакт)'
        required: true
        default: false
        type: boolean
      deploy_pages:
        description: 'Развернуть текущий commit в GitHub Pages'
        required: true
        default: false
        type: boolean

concurrency:
  group: static-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify public build
        run: node .quality/verify-public.mjs
      - name: Build reproducible public ZIP from an explicit allowlist
        run: >-
          git archive --format=zip --output=roadmap-site-public.zip HEAD
          README.md RELEASE_NOTES.md LICENSE app.html avatar.jpg catalog-img catalog.html index.html
          media robots.txt schemas Инструкция_Roadmap.md Локер-роадмапов.html
      - name: Verify the release ZIP excludes private material
        run: |
          if unzip -Z1 roadmap-site-public.zip | grep -Eq '(^|/)private/|(^|/)roadmap-data\.json$'; then
            echo "Release ZIP contains private material." >&2
            exit 1
          fi
      - name: Upload dry-run artifact
        uses: actions/upload-artifact@v7
        with:
          name: roadmap-static-${{ github.sha }}
          path: roadmap-site-public.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Resolve and validate tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          MANUAL_PUBLISH: ${{ inputs.publish_release }}
        run: |
          TAG=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$MANUAL_PUBLISH" != "true" ]; then
              echo "Ручной запуск без флага публикации Release."
              exit 0
            fi
            TAG="$MANUAL_TAG"
          elif [ "$EVENT_NAME" = "push" ] && printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+'; then
            TAG="$REF_NAME"
          else
            # Автоматическое определение версии из README.md при обычном push в main
            DETECTED=$(grep -oE '\*\*v[0-9]+\.[0-9]+(\.[0-9]+)?' README.md | head -n 1 | tr -d '*')
            if [ -n "$DETECTED" ]; then
              if gh release view "$DETECTED" >/dev/null 2>&1; then
                echo "Релиз $DETECTED уже существует. Пропуск."
                exit 0
              else
                echo "Найдена новая версия в README.md: $DETECTED"
                TAG="$DETECTED"
              fi
            fi
          fi

          if [ -z "$TAG" ]; then
            echo "Версия для публикации не определена. Пропуск."
            exit 0
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "Тег должен иметь вид vX.Y или vX.Y.Z: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
      - name: Download packaged site
        if: steps.tag.outputs.should_publish == 'true'
        uses: actions/download-artifact@v7
        with:
          name: roadmap-static-${{ github.sha }}
      - name: Create or refresh release
        if: steps.tag.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          NOTES_ARG="--generate-notes"
          if [ -f "RELEASE_NOTES.md" ]; then
            NOTES_ARG="--notes-file RELEASE_NOTES.md"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" roadmap-site-public.zip --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "Roadmap $TAG" $NOTES_ARG
          else
            gh release create "$TAG" roadmap-site-public.zip --target "$GITHUB_SHA" --title "Roadmap $TAG" $NOTES_ARG
          fi

  pages:
    name: Deploy GitHub Pages
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify again before Pages
        run: node .quality/verify-public.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build tracked-only Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          if git ls-tree -r HEAD | awk '$1 == "120000" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "Pages artifact не допускает символические ссылки." >&2
            exit 1
          fi
          mkdir _site
          git archive --format=tar HEAD | tar -xf - -C _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
