zOt1IZehNXT/pdz5neUVUqqMnIpy7A=="}</script><script>(function unlockBoot() {
    const data = JSON.parse(document.getElementById('locker-payload').textContent);
    const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    document.getElementById('locker-form').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('locker-error');
      const button = document.getElementById('locker-open');
      error.textContent = '';
      if (!globalThis.crypto?.subtle) { error.textContent = 'Откройте файл по HTTPS или локально.'; return; }
      button.disabled = true;
      button.textContent = 'Открываем...';
      try {
        const password = document.getElementById('locker-password').value;
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(data.salt), iterations: data.iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const decoded = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(data.iv) }, key, bytes(data.ct));
        const html = new TextDecoder().decode(decoded);
        document.open(); document.write(html); document.close();
      } catch {
        error.textContent = 'Неверный пароль или поврежденный файл.';
        button.disabled = false; button.textContent = 'Открыть';
      }
    });
  })();</script></body></html>
